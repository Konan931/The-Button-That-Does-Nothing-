<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A futuristic anti-game button that claims to do nothing while slowly becoming unstable.">
    <title>The Button That Does Nothing</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000a14'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%2300f3ff' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%2300f3ff'/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background" aria-hidden="true"></div>

    <aside class="hud" aria-label="Button status">
        <span id="clickCounter">Clicks: 0</span>
        <span id="chaosLevel">Chaos: harmless</span>
    </aside>

    <main class="container">
        <section class="button-container" aria-labelledby="buttonTitle">
            <h1 id="buttonTitle" class="visually-hidden">The Button That Does Nothing</h1>

            <button id="theButton" class="futuristic-button" type="button">
                <span class="button-text">The Button That Does Nothing</span>
                <span class="button-glow" aria-hidden="true"></span>
                <span class="button-particle" aria-hidden="true"></span>
            </button>

            <p class="subtitle">This button literally does nothing. Don't waste your clicks.</p>

            <button id="resetButton" class="reset-button" type="button">Reset Nothing</button>
        </section>
    </main>

    <script src="effects.js"></script>
</body>
</html>
