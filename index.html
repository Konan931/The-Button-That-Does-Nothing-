<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Button That Does Nothing</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background"></div>
        <div class="hud">
        <span id="clickCounter">Clicks: 0</span>
        <span id="chaosLevel">Chaos: harmless</span>
    </div>    
    <div class="container">
        <div class="button-container">
            <button id="theButton" class="futuristic-button">
                <span class="button-text">The Button That Does Nothing</span>
                <div class="button-glow"></div>
                <div class="button-particle"></div>
            </button>
            <p class="subtitle">This button literally does nothing. Don't waste your clicks.</p>
        </div>
    </div>

    <script src="effects.js"></script>
</body>
</html>
