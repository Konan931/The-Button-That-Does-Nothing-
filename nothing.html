<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The ending screen for The Button That Does Nothing.">
    <title>Nothing</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000a14'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%2300f3ff' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%2300f3ff'/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="ending-page">
    <div class="background" aria-hidden="true"></div>

    <main class="container">
        <section class="ending-container" aria-labelledby="endingTitle">
            <h1 id="endingTitle">You found nothing.</h1>
            <p>You made it to 100 clicks.</p>
            <p>It really did nothing after all.</p>
            <div class="emoji" aria-hidden="true">😜</div>
            <a class="ending-link" href="index.html">Return to the button</a>
        </section>
    </main>

    <script>
        function startEndingConfetti() {
            const canvas = document.createElement("canvas");
            canvas.id = "confetti-canvas";
            canvas.style.position = "fixed";
            canvas.style.inset = "0";
            canvas.style.width = "100%";
            canvas.style.height = "100%";
            canvas.style.pointerEvents = "none";
            canvas.style.zIndex = "100";
            document.body.appendChild(canvas);

            const context = canvas.getContext("2d");
            const colors = ["#ff0000", "#00ff00", "#0000ff", "#ffff00", "#ff00ff", "#00ffff"];
            const particles = [];

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            function createParticle() {
                return {
                    x: Math.random() * canvas.width,
                    y: -20,
                    size: Math.random() * 10 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speed: Math.random() * 3 + 2,
                    rotation: Math.random() * 360,
                    rotationSpeed: Math.random() * 10 - 5
                };
            }

            function animate() {
                context.clearRect(0, 0, canvas.width, canvas.height);

                particles.forEach((particle, index) => {
                    context.save();
                    context.translate(particle.x, particle.y);
                    context.rotate((particle.rotation * Math.PI) / 180);
                    context.fillStyle = particle.color;
                    context.fillRect(-particle.size / 2, -particle.size / 2, particle.size, particle.size);
                    context.restore();

                    particle.y += particle.speed;
                    particle.rotation += particle.rotationSpeed;

                    if (particle.y > canvas.height + particle.size) {
                        particles[index] = createParticle();
                    }
                });

                if (window.confettiAnimation) {
                    requestAnimationFrame(animate);
                }
            }

            resizeCanvas();
            for (let index = 0; index < 100; index += 1) {
                particles.push(createParticle());
            }

            window.confettiAnimation = true;
            window.addEventListener("resize", resizeCanvas, { once: true });
            animate();

            setTimeout(() => {
                window.confettiAnimation = false;
                canvas.remove();
            }, 5000);
        }

        document.addEventListener("DOMContentLoaded", startEndingConfetti);
    </script>
</body>
</html>
